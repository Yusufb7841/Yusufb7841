<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Word order in text classification</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the same three words, reordered: lines link each word to its new position -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round">
    <path d="M36 47 C36 66 68 62 68 81" stroke="#FFFFFF"/>
    <path d="M66 47 C66 66 98 62 98 81" stroke="#FDE68A"/>
    <path d="M94 47 C94 66 34 62 34 81" stroke="#A7F3D0"/>
  </g>
  <rect x="21" y="30" width="30" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="57" y="30" width="18" height="14" rx="7" fill="#FDE68A"/>
  <rect x="81" y="30" width="26" height="14" rx="7" fill="#A7F3D0"/>
  <rect x="21" y="84" width="26" height="14" rx="7" fill="#A7F3D0"/>
  <rect x="53" y="84" width="30" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="89" y="84" width="18" height="14" rx="7" fill="#FDE68A"/>
</svg>
